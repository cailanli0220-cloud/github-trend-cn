name: 每日趋势扫描与部署

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC = 北京时间 09:00，GitHub 调度可能延迟
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'data/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: daily-trend-pages
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Test ranking, fallback and data safety
        run: python -m unittest discover -s tests -v
      - name: Scan public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: python scripts/scan.py
      - name: Save daily data and tracking history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Chinese GitHub digest"
            git push origin HEAD:main
          fi
      - name: Prepare public files only
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js favicon.svg _site/
          cp data/trending.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
